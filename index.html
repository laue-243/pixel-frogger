<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Frogger</title>
<style>
body { background: #000; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; image-rendering: pixelated; }
canvas { border: 4px solid #333; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game" width="400" height="500"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
let frog = {x:180, y:460};
let cars = [];
let logs = [];
let score = 0;
let frame = 0;

function spawnCars() {
  for (let lane=0; lane<4; lane++) {
    cars.push({x: -60, y: 300 + lane*30, speed: 2 + Math.random()*2, dir: lane%2===0?1:-1, w:50});
  }
}
function spawnLogs() {
  for (let lane=0; lane<3; lane++) {
    logs.push({x: 400, y: 80 + lane*40, speed: 1.5 + Math.random(), w:80});
  }
}
spawnCars(); spawnLogs();

function loop() {
  frame++;
  if (frame % 120 === 0) { spawnCars(); spawnLogs(); }
  cars.forEach(c => {
    c.x += c.speed * c.dir;
    if (c.dir>0 && c.x>420) c.x=-60;
    if (c.dir<0 && c.x<-60) c.x=420;
    if (frog.x < c.x+c.w && frog.x+30 > c.x && frog.y < c.y+20 && frog.y+20 > c.y) {
      alert('Splat! Score: '+score); location.reload();
    }
  });
  logs.forEach(l => {
    l.x -= l.speed;
    if (l.x < -100) l.x = 420;
  });
  let onLog = false;
  if (frog.y < 200) {
    logs.forEach(l => {
      if (frog.x > l.x && frog.x < l.x + l.w && Math.abs(frog.y - l.y) < 20) {
        onLog = true;
        frog.x -= l.speed;
      }
    });
    if (!onLog) { alert('Drowned! Score: '+score); location.reload(); }
  }
  if (frog.y < 20) { score += 10; frog.y = 460; frog.x = 180; }

  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,400,500);
  ctx.fillStyle = '#0a0';
  ctx.fillRect(0,0,400,40);
  ctx.fillRect(0,460,400,40);
  ctx.fillRect(0,220,400,60);
  ctx.fillStyle = '#00f';
  ctx.fillRect(0,40,400,180);
  ctx.fillStyle = '#333';
  ctx.fillRect(0,280,400,180);
  ctx.fillStyle = '#8B4513';
  logs.forEach(l => ctx.fillRect(l.x, l.y, l.w, 25));
  ctx.fillStyle = '#f00';
  cars.forEach(c => ctx.fillRect(c.x, c.y, c.w, 20));
  ctx.fillStyle = '#0f0';
  ctx.fillRect(frog.x, frog.y, 30, 20);
  ctx.fillStyle = '#fff';
  ctx.font = '16px monospace';
  ctx.fillText('Score: '+score, 10, 20);
  requestAnimationFrame(loop);
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') frog.y = Math.max(0, frog.y-30);
  if (e.key === 'ArrowDown') frog.y = Math.min(470, frog.y+30);
  if (e.key === 'ArrowLeft') frog.x = Math.max(0, frog.x-30);
  if (e.key === 'ArrowRight') frog.x = Math.min(370, frog.x+30);
});

loop();
</script>
</body>
</html>
